<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Timeline of Me</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Timeline">
<meta name="theme-color" content="#EDF0EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1412" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Sign in (first time only) -->
<section id="signinView" class="signin-page" hidden>
  <form class="signin" id="signinForm" autocomplete="on">
    <h2>Sign in</h2>
    <p class="muted">You'll only need to do this once on this phone.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" inputmode="email" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button type="submit" class="save" id="signinBtn">Sign in</button>
    <p class="error" id="signinError" hidden></p>
  </form>
</section>

<!-- App: timeline scrolls above, log box pinned at the bottom -->
<div id="appView" class="shell" hidden>
  <div class="scroller" id="scroller">
    <div class="col">
      <div class="top-bits">
        <button type="button" class="more" id="moreBtn" hidden>Show older entries</button>
      </div>
      <div id="status" class="notice" hidden></div>
      <div id="feed"></div>
      <div id="upcoming" hidden></div>
    </div>
  </div>

  <form class="composer" id="composer" autocomplete="off">
    <div class="col composer-col">
      <div class="edit-flag" id="editFlag" hidden><span>Editing your entry</span><button type="button" class="link" id="cancelEdit">Cancel</button></div>
      <div class="thumbs" id="thumbs" hidden></div>
      <div class="when-row" id="whenRow" hidden>
        <span class="when-label">Time</span>
        <input type="datetime-local" id="whenInput" aria-label="Entry time">
        <button type="button" class="link" id="whenNow">Use now</button>
      </div>
      <div class="search-bar" id="searchBar" hidden>
        <label for="searchInput" class="sr-only">Search your log</label>
        <input id="searchInput" type="search" placeholder="Search your log" autocomplete="off" enterkeyhint="search">
        <button type="button" class="link" id="searchDone">Done</button>
      </div>
      <div class="ref-chips" id="refChips" hidden></div>
      <div class="bar" id="logBar">
        <button type="button" class="icon-btn" id="moreMenuBtn" aria-label="More options" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
        </button>
        <label class="icon-btn" for="photoInput" aria-label="Add photo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        </label>
        <input id="photoInput" type="file" accept="image/*" multiple hidden>
        <button type="button" class="icon-btn" id="whenBtn" aria-label="Change time">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
        </button>
        <textarea id="text" rows="1" placeholder="What's happening?" aria-label="Entry text"></textarea>
        <button type="submit" class="send" id="saveBtn" aria-label="Log entry">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></svg>
        </button>
      </div>
    </div>
  </form>
</div>

<!-- References: full screen, styled like the log -->
<section class="refs-view" id="refsView" hidden aria-label="References">
  <div class="refs-scroll">
    <div class="col">
      <div class="refs-head">
        <h2>References</h2>
        <button type="button" class="link" id="refsDone">Done</button>
      </div>
      <p class="refs-intro">Link one in a log entry by typing its name and tapping the suggestion. Plain words never point here.</p>
      <div id="refsList"></div>
      <form id="refForm" class="ref-form" hidden autocomplete="off">
        <label for="refName">Name</label>
        <input id="refName" type="text" maxlength="80" placeholder="Soy milk" required>
        <label for="refDesc">Description</label>
        <textarea id="refDesc" rows="4" placeholder="Silk unsweetened organic, 80 cal per cup. What I use in coffee and oatmeal."></textarea>
        <div class="ref-photo-row">
          <div class="thumb" id="refPhotoThumb" hidden></div>
          <label class="link" for="refPhotoInput" id="refPhotoLabel">Add photo</label>
          <input id="refPhotoInput" type="file" accept="image/*" hidden>
        </div>
        <div id="refChangeBox" hidden>
          <label for="refWhen">This change started</label>
          <input id="refWhen" type="datetime-local">
          <label class="check"><input type="checkbox" id="refTypo"> Just fixing a typo (don't keep the old version)</label>
        </div>
        <p class="ref-history" id="refHistory" hidden></p>
        <div class="ref-actions">
          <button type="submit" class="save-btn" id="refSave">Save</button>
          <button type="button" class="link" id="refCancel">Cancel</button>
          <button type="button" class="link" id="refArchive" hidden>Archive</button>
        </div>
      </form>
    </div>
  </div>
  <div class="refs-foot" id="refsFoot"><button type="button" class="save-btn" id="refAdd">Add reference</button></div>
</section>

<div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="More options" hidden>
  <div class="sheet-grip" aria-hidden="true"></div>
  <button type="button" class="sheet-item" id="syncStravaBtn">
    <span class="sheet-title">Sync Strava</span><span class="sheet-sub">Runs your Timeline Health shortcut</span>
  </button>
  <button type="button" class="sheet-item" id="refsBtn">
    <span class="sheet-title">References</span><span class="sheet-sub">Things you mention a lot, like your usual milk</span>
  </button>
  <button type="button" class="sheet-item" id="searchBtn">
    <span class="sheet-title">Search</span><span class="sheet-sub">Find any entry in your log</span>
  </button>
  <div class="sheet-status" id="stravaConn"></div>
  <button type="button" class="sheet-item sheet-signout" id="signOutBtn"><span class="sheet-title">Sign out</span></button>
</div>
<div class="toast" id="toast" hidden></div>
<div class="lightbox" id="lightbox" hidden><img alt="" id="lightImg"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
