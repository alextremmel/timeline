<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Timeline of Me</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Timeline">
<meta name="theme-color" content="#EDF0EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1412" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Sign in (first time only) -->
<section id="signinView" class="signin-page" hidden>
  <form class="signin" id="signinForm" autocomplete="on">
    <h2>Sign in</h2>
    <p class="muted">You'll only need to do this once on this phone.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" inputmode="email" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button type="submit" class="save" id="signinBtn">Sign in</button>
    <p class="error" id="signinError" hidden></p>
  </form>
</section>

<!-- App: timeline scrolls above, log box pinned at the bottom -->
<div id="appView" class="shell" hidden>
  <div class="scroller" id="scroller">
    <div class="col">
      <div class="top-bits">
        <button type="button" class="more" id="moreBtn" hidden>Show older entries</button>
        <div class="conns"><span id="stravaConn"></span><button type="button" class="quiet" id="signOutBtn">Sign out</button></div>
      </div>
      <div id="status" class="notice" hidden></div>
      <div id="feed"></div>
    </div>
  </div>

  <form class="composer" id="composer" autocomplete="off">
    <div class="col composer-col">
      <div class="edit-flag" id="editFlag" hidden><span>Editing an entry</span><button type="button" class="link" id="cancelEdit">Cancel</button></div>
      <div class="thumbs" id="thumbs" hidden></div>
      <div class="when-row" id="whenRow" hidden>
        <span class="when-label">Time</span>
        <input type="datetime-local" id="whenInput" aria-label="Entry time">
        <button type="button" class="link" id="whenNow">Use now</button>
      </div>
      <div class="bar">
        <label class="icon-btn" for="photoInput" aria-label="Add photo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        </label>
        <input id="photoInput" type="file" accept="image/*" multiple hidden>
        <button type="button" class="icon-btn" id="whenBtn" aria-label="Change time">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
        </button>
        <textarea id="text" rows="1" placeholder="What's happening?" aria-label="Entry text"></textarea>
        <button type="submit" class="save" id="saveBtn">Log</button>
      </div>
    </div>
  </form>
</div>

<div class="toast" id="toast" hidden></div>
<div class="lightbox" id="lightbox" hidden><img alt="" id="lightImg"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
